name: Televa APK Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Televa debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build universal debug APK
        run: ./gradlew assembleAfatDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apks
          cp TMessagesProj_App/build/outputs/apk/*/debug/*.apk apks/Televa-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Televa-APK
          path: apks/Televa-debug.apk
          retention-days: 90
